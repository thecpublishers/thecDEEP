<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Designed placeholder image for Printing &amp; Consultation</title>
  <desc id="desc">Abstract editorial publishing artwork for the Printing &amp; Consultation service. This is an intentional placeholder for future service photography.</desc>
  
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF6EF"/>
      <stop offset="0.55" stop-color="#F0E7DC"/>
      <stop offset="1" stop-color="#E8DDD0"/>
    </linearGradient>
    <linearGradient id="redWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D2A"/>
      <stop offset="1" stop-color="#9E0F1A"/>
    </linearGradient>
    <linearGradient id="inkWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2724"/>
      <stop offset="1" stop-color="#141312"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1E1E1E" flood-opacity="0.18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
    </filter>
    <pattern id="fineGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1E1E1E" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#paperWash)"/>
  <rect width="1200" height="800" fill="url(#fineGrid)" opacity="0.3"/>
  <rect x="0" y="0" width="18" height="800" fill="#E11D2A"/>
  <text x="70" y="94" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="4" fill="#626262">THEC / PUBLISHING SERVICES</text>
  <text x="70" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="126" fill="#1E1E1E" opacity="0.13">03</text>
  
        <g transform="translate(610 210)">
          <rect x="0" y="90" width="430" height="280" fill="#1E1E1E" filter="url(#softShadow)"/>
          <rect x="32" y="42" width="366" height="42" fill="#FAF6EF"/>
          <rect x="32" y="42" width="366" height="6" fill="#E11D2A"/>
          <path d="M32 380h366" stroke="#1E1E1E" stroke-width="2" opacity="0.25"/>
          <path d="M75 430v40M420 430v40M75 452h-28M448 452h-28M75 452v25M448 452v25" stroke="#9E0F1A" stroke-width="2"/>
          <text x="58" y="242" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="4" fill="#FAF6EF">PRINT READY</text>
          <text x="58" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#FAF6EF">Form &amp; finish</text>
        </g>
        <rect x="720" y="110" width="230" height="230" fill="#E11D2A" opacity="0.9"/>
        
  <text x="70" y="650" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#9E0F1A">SERVICE 03</text>
  <text x="70" y="706" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#1E1E1E">Printing &amp; Consultation</text>
  <text x="70" y="752" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2.3" fill="#626262">DESIGNED IMAGE PLACEHOLDER · REPLACE WITH BRAND PHOTOGRAPHY</text>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.7"/>
</svg>
