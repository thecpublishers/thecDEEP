<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Designed placeholder image for Transcription</title>
  <desc id="desc">Abstract editorial publishing artwork for the Transcription service. This is an intentional placeholder for future service photography.</desc>
  
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF6EF"/>
      <stop offset="0.55" stop-color="#F0E7DC"/>
      <stop offset="1" stop-color="#E8DDD0"/>
    </linearGradient>
    <linearGradient id="redWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D2A"/>
      <stop offset="1" stop-color="#9E0F1A"/>
    </linearGradient>
    <linearGradient id="inkWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2724"/>
      <stop offset="1" stop-color="#141312"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1E1E1E" flood-opacity="0.18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
    </filter>
    <pattern id="fineGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1E1E1E" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#paperWash)"/>
  <rect width="1200" height="800" fill="url(#fineGrid)" opacity="0.3"/>
  <rect x="0" y="0" width="18" height="800" fill="#E11D2A"/>
  <text x="70" y="94" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="4" fill="#626262">THEC / PUBLISHING SERVICES</text>
  <text x="70" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="126" fill="#1E1E1E" opacity="0.13">06</text>
  
        <g transform="translate(570 280)">
          <rect width="500" height="300" fill="#1E1E1E" filter="url(#softShadow)"/>
          <path d="M45 90v120M75 60v180M105 110v80M135 75v150M165 95v110M195 55v190M225 80v140M255 110v80M285 70v160M315 96v108M345 50v200M375 90v120M405 115v70M435 70v160" stroke="#E11D2A" stroke-width="6" stroke-linecap="round"/>
          <text x="45" y="252" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="4" fill="#FAF6EF">VOICE → TEXT</text>
        </g>
        <rect x="960" y="160" width="170" height="170" fill="#9E0F1A" opacity="0.9"/>
        
  <text x="70" y="650" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" fill="#9E0F1A">SERVICE 06</text>
  <text x="70" y="706" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#1E1E1E">Transcription</text>
  <text x="70" y="752" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2.3" fill="#626262">DESIGNED IMAGE PLACEHOLDER · REPLACE WITH BRAND PHOTOGRAPHY</text>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.7"/>
</svg>
