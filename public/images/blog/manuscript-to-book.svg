<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Manuscript to book editorial placeholder</title>
  <desc id="desc">An open manuscript on the left and a finished dark book on the right, joined by a red editorial line. Designed placeholder artwork for the blog.</desc>
  
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF6EF"/>
      <stop offset="0.55" stop-color="#F0E7DC"/>
      <stop offset="1" stop-color="#E8DDD0"/>
    </linearGradient>
    <linearGradient id="redWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D2A"/>
      <stop offset="1" stop-color="#9E0F1A"/>
    </linearGradient>
    <linearGradient id="inkWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2724"/>
      <stop offset="1" stop-color="#141312"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1E1E1E" flood-opacity="0.18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
    </filter>
    <pattern id="fineGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1E1E1E" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="900" fill="url(#paperWash)"/>
  <rect width="1400" height="900" fill="url(#fineGrid)" opacity="0.28"/>
  <rect x="0" y="0" width="18" height="900" fill="#E11D2A"/>
  <text x="80" y="96" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="4" fill="#626262">THE THEC EDITORIAL DESK</text>
  <text x="80" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#1E1E1E">From manuscript to book.</text>

  <g transform="translate(80 240)">
    <path d="M0 0 C150-30 290-10 400 40 L400 500 C290 450 150 430 0 460Z" fill="#FFFDF9" filter="url(#softShadow)"/>
    <path d="M400 40 C510-10 650-30 800 0 L800 460 C650 430 510 450 400 500Z" fill="#FFFDF9" filter="url(#softShadow)"/>
    <path d="M60 100h260M60 130h220M60 160h280M60 190h200M60 220h260M60 250h240" stroke="#C8B9A9" stroke-width="5"/>
    <path d="M60 340h190M60 370h250M60 400h160" stroke="#C8B9A9" stroke-width="5"/>
    <path d="M460 100h260M460 130h220M460 160h280M460 190h200M460 220h240" stroke="#C8B9A9" stroke-width="5"/>
    <path d="M460 340h130" stroke="#E11D2A" stroke-width="4"/>
    <path d="M540 388l58 22-55 40" fill="none" stroke="#E11D2A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(980 240) rotate(-5 150 240)" filter="url(#softShadow)">
    <rect width="300" height="480" fill="url(#inkWash)"/>
    <rect x="0" y="0" width="24" height="480" fill="#E11D2A"/>
    <text x="54" y="82" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="3" fill="#D8CCBE">THE FINISHED BOOK</text>
    <text x="52" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#FAF6EF">Your</text>
    <text x="52" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#FAF6EF">story,</text>
    <text x="52" y="311" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="50" fill="#E11D2A">held.</text>
    <path d="M54 360h130" stroke="#E11D2A" stroke-width="5"/>
    <text x="54" y="430" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="2" fill="#B9AEA2">PLACEHOLDER ARTWORK</text>
  </g>

  <g transform="translate(760 650)">
    <rect width="540" height="44" fill="#E11D2A"/>
    <text x="20" y="27" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2.7" fill="#fff">DESIGNED BLOG IMAGE PLACEHOLDER</text>
  </g>
  <rect width="1400" height="900" filter="url(#grain)" opacity="0.7"/>
</svg>
